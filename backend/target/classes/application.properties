# ===============================

# Server Configuration

# ===============================

server.port=8081

# ===============================

# MySQL Database Configuration

# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================

# JPA / Hibernate Configuration

# ===============================

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================

# Optional (Good Practice)

# ===============================

spring.jpa.open-in-view=false

# ===============================

# Disable H2 Console (Optional)

# ===============================

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration
